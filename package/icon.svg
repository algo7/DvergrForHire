<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- DvergrForHire icon: original line drawing of a hooded Dvergr (circlet gem, braided beard) and a stack of coins, glowing
       in Dvergr-lantern orange (#ff9b30), on a round wooden shield (same frame as the author's LoadoutBuffs and SealsAtHome
       icons). Rendered to icon.png with cairosvg (1024 px, then LANCZOS down to 256). -->
  <defs>
    <clipPath id="wood"><circle cx="128" cy="128" r="96"/></clipPath>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="#1c2128"/>
  <circle cx="128" cy="128" r="108" fill="#808c98"/>
  <circle cx="128" cy="128" r="96" fill="#704c2e"/>
  <g clip-path="url(#wood)" stroke="#593c26" stroke-width="3">
    <path d="M 48 20 V 236 M 72 20 V 236 M 96 20 V 236 M 120 20 V 236 M 144 20 V 236 M 168 20 V 236 M 192 20 V 236 M 216 20 V 236"/>
  </g>
  <circle cx="128" cy="128" r="96" fill="url(#shade)"/>
  <g transform="translate(140 132)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="dvergr">
      <!-- hood: a broad dome whose tip folds back -->
      <path d="M -44 -14 C -46 -50 -22 -76 8 -80 C 22 -82 34 -78 42 -70 C 32 -68 28 -62 32 -54 C 42 -40 46 -28 44 -14"/>
      <!-- circlet band across the forehead -->
      <path d="M -46 -14 H 46"/>
      <!-- nose and moustache -->
      <path d="M -7 0 C -13 14 -7 22 0 22 C 7 22 13 14 7 0"/>
      <path d="M -4 28 C -14 26 -24 32 -28 44 M 4 28 C 14 26 24 32 28 44"/>
      <!-- beard: broad, ending in two braids -->
      <path d="M -40 -4 C -44 30 -34 56 -16 70 L -16 84 M 40 -4 C 44 30 34 56 16 70 L 16 84 M -16 70 C -6 74 6 74 16 70"/>
      <path d="M -12 52 V 62 M 0 42 V 64 M 12 52 V 62"/>
    </g>
    <use href="#dvergr" stroke="#ff9b30" stroke-width="26" stroke-opacity="0.12"/>
    <use href="#dvergr" stroke="#ff9b30" stroke-width="18" stroke-opacity="0.22"/>
    <use href="#dvergr" stroke="#ff9b30" stroke-width="9"/>
    <!-- the circlet's gem and the eyes -->
    <path d="M 0 -24 L 8 -14 L 0 -4 L -8 -14 Z" fill="#ff9b30" stroke="#ff9b30" stroke-width="4"/>
    <circle cx="-18" cy="-2" r="5" fill="#ff9b30"/>
    <circle cx="18" cy="-2" r="5" fill="#ff9b30"/>
  </g>
  <!-- a stack of coins -->
  <g transform="translate(66 162)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="coin">
      <ellipse cx="0" cy="-22" rx="20" ry="7"/>
      <path d="M -20 -22 V 10 M 20 -22 V 10"/>
      <path d="M -20 -6 A 20 7 0 0 0 20 -6 M -20 10 A 20 7 0 0 0 20 10"/>
    </g>
    <use href="#coin" stroke="#ff9b30" stroke-width="22" stroke-opacity="0.12"/>
    <use href="#coin" stroke="#ff9b30" stroke-width="15" stroke-opacity="0.22"/>
    <use href="#coin" stroke="#ff9b30" stroke-width="8"/>
  </g>
</svg>
