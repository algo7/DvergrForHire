<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- DvergrForHire icon: original line drawing of a sword and a coin with a dollar sign, glowing Dvergr-lantern orange
       (#ff9b30), on the round wooden shield of the author's LoadoutBuffs and SealsAtHome icons. Rendered to icon.png with
       cairosvg (1024 px, then LANCZOS down to 256). -->
  <defs>
    <clipPath id="wood"><circle cx="128" cy="128" r="96"/></clipPath>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="#1c2128"/>
  <circle cx="128" cy="128" r="108" fill="#808c98"/>
  <circle cx="128" cy="128" r="96" fill="#704c2e"/>
  <g clip-path="url(#wood)" stroke="#593c26" stroke-width="3">
    <path d="M 48 20 V 236 M 72 20 V 236 M 96 20 V 236 M 120 20 V 236 M 144 20 V 236 M 168 20 V 236 M 192 20 V 236 M 216 20 V 236"/>
  </g>
  <circle cx="128" cy="128" r="96" fill="url(#shade)"/>
  <g transform="translate(140 130) rotate(35)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="sword">
      <path d="M -13 34 V -54 L 0 -74 L 13 -54 V 34"/>
      <path d="M -32 36 H 32 M 0 40 V 62"/>
      <circle cx="0" cy="72" r="8"/></g>
    <use href="#sword" stroke="#ff9b30" stroke-width="26" stroke-opacity="0.12"/>
    <use href="#sword" stroke="#ff9b30" stroke-width="18" stroke-opacity="0.22"/>
    <use href="#sword" stroke="#ff9b30" stroke-width="9"/>
  </g>
  <g transform="translate(84 94)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="coin">
      <circle r="24"/>
      <path d="M 9 -9 C 5 -14 -10 -14 -10 -5 C -10 4 10 -1 10 8 C 10 16 -6 16 -10 10 M 0 -19 V 19"/></g>
    <use href="#coin" stroke="#ff9b30" stroke-width="23" stroke-opacity="0.12"/>
    <use href="#coin" stroke="#ff9b30" stroke-width="16" stroke-opacity="0.22"/>
    <use href="#coin" stroke="#ff9b30" stroke-width="8"/>
  </g>
</svg>
